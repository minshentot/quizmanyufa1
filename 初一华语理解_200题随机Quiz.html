<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>初一华语理解 Quiz</title>
<style>
:root{
  --bg:#09111f; --panel:#111b2d; --panel2:#162238; --line:#26364f;
  --text:#edf4ff; --muted:#93a4bb; --gold:#e2b96f; --blue:#69a7ff;
  --green:#52d69a; --red:#ff7887; --white:#fff;
}
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; color:var(--text);
  font-family:"Noto Sans SC","Microsoft YaHei","PingFang SC",Arial,sans-serif;
  background:
    radial-gradient(circle at 15% 0%,rgba(70,112,190,.22),transparent 34%),
    radial-gradient(circle at 100% 10%,rgba(178,122,71,.13),transparent 28%),
    linear-gradient(160deg,#07101d 0%,#0c1424 55%,#101827 100%);
}
.wrap{width:min(1080px,94vw); margin:0 auto; padding:28px 0 48px}
.topbar{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:18px}
.brand small{letter-spacing:.18em;color:var(--gold);font-weight:800}
.brand h1{margin:5px 0 5px;font-size:clamp(26px,4vw,42px);line-height:1.1}
.brand p{margin:0;color:var(--muted)}
.pill{border:1px solid var(--line);background:rgba(17,27,45,.86);padding:9px 12px;border-radius:999px;color:#cbd7e8;font-size:13px}
.panel{background:linear-gradient(180deg,rgba(18,29,48,.97),rgba(13,23,39,.97));border:1px solid var(--line);border-radius:18px;box-shadow:0 22px 60px rgba(0,0,0,.22);overflow:hidden}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border-bottom:1px solid var(--line)}
.stat{background:#101a2b;padding:14px 16px}
.stat b{display:block;font-size:19px;margin-top:2px}
.stat span{font-size:11px;color:var(--muted);letter-spacing:.08em}
.progress{height:6px;background:#0a1220}
.progress>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--gold));transition:.25s}
.quiz{padding:clamp(18px,4vw,34px)}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.tag{font-size:12px;border:1px solid #32455f;color:#b9cae0;border-radius:999px;padding:5px 9px;background:#122038}
.qno{color:var(--gold);font-weight:800}
.question{font-size:clamp(18px,2.5vw,25px);line-height:1.65;margin:8px 0 20px;font-weight:750}
.stem{display:block;margin-top:10px;padding:13px 14px;border-radius:12px;background:#0c1727;border:1px solid #253850;color:#f7fbff;font-weight:600}
.stem u{text-decoration-color:var(--gold);text-decoration-thickness:2px;text-underline-offset:4px}
.options{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.option{
  width:100%;text-align:left;padding:15px 16px;border-radius:13px;border:1px solid #2b3d58;
  background:#132039;color:#edf4ff;cursor:pointer;font-size:15px;line-height:1.45;transition:.16s;
}
.option:hover:not(:disabled){transform:translateY(-1px);border-color:#5b7aa2;background:#162741}
.option:disabled{cursor:default}
.option.correct{border-color:rgba(82,214,154,.95);background:rgba(36,121,88,.24)}
.option.wrong{border-color:rgba(255,120,135,.95);background:rgba(134,52,65,.24)}
.letter{display:inline-grid;place-items:center;width:28px;height:28px;border:1px solid #3d5270;border-radius:8px;margin-right:9px;font-weight:900;color:#cbd8ea}
.feedback{display:none;margin-top:18px;padding:16px;border:1px solid #31445f;border-radius:13px;background:#0d1828}
.feedback.show{display:block}
.feedback h3{margin:0 0 7px;font-size:17px}
.feedback.ok h3{color:var(--green)} .feedback.no h3{color:var(--red)}
.lesson{margin:8px 0;color:var(--gold);font-size:13px;font-weight:800}
.explain{color:#dbe7f5;line-height:1.65}
.tip{margin-top:8px;color:#9fb1c7;font-size:13px}
.controls{display:flex;justify-content:space-between;gap:12px;margin-top:20px}
.btn{border:0;border-radius:11px;padding:12px 16px;font-weight:850;cursor:pointer}
.btn.primary{background:linear-gradient(135deg,#5b92eb,#7ab3ff);color:#07111e}
.btn.secondary{background:#16243a;color:#d9e6f7;border:1px solid #30435e}
.btn:disabled{opacity:.45;cursor:not-allowed}
.home{padding:clamp(22px,5vw,42px)}
.home h2{font-size:28px;margin:0 0 8px}
.home p{color:var(--muted);line-height:1.7}
.homegrid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:20px 0}
.card{border:1px solid #2b3c56;border-radius:13px;padding:14px;background:#101c30}
.card b{display:block;font-size:18px;color:#f8fbff} .card span{font-size:12px;color:#91a4bd}
.note{margin:18px 0;padding:13px 14px;border-left:4px solid var(--gold);background:#121f34;color:#c6d4e6;border-radius:0 10px 10px 0}
.result{padding:32px;text-align:center}
.result h2{font-size:32px;margin:0 0 10px}
.bigscore{font-size:64px;font-weight:900;color:var(--gold);line-height:1}
.result p{color:var(--muted)}
.breakdown{max-width:650px;margin:20px auto;text-align:left}
.row{display:grid;grid-template-columns:140px 1fr 70px;gap:10px;align-items:center;margin:9px 0}
.bar{height:9px;background:#0a1321;border-radius:99px;overflow:hidden} .bar i{display:block;height:100%;background:#5e98ee}
.milestone{position:fixed;left:50%;top:22px;transform:translateX(-50%) translateY(-20px);opacity:0;pointer-events:none;background:#fff;color:#0d1724;padding:10px 16px;border-radius:999px;font-weight:900;box-shadow:0 12px 35px rgba(0,0,0,.3);transition:.25s;z-index:20}
.milestone.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:760px){
  .stats{grid-template-columns:1fr 1fr} .options{grid-template-columns:1fr}
  .homegrid{grid-template-columns:1fr 1fr} .topbar{flex-direction:column}
  .row{grid-template-columns:95px 1fr 55px}
}
</style>
</head>
<body>
<div class="milestone" id="milestone"></div>
<div class="wrap">
  <div class="topbar">
    <div class="brand">
      <small>JUNIOR 1 · CHINESE COMPREHENSION</small>
      <h1>初一华语理解 Quiz</h1>
      <p>每轮随机 50 题｜选择题 A–D｜作答后立即显示题解</p>
    </div>
    <div class="pill">题库 200 题</div>
  </div>

  <div class="panel" id="app"></div>
</div>

<script>
const BANK = [{"category": "修辞", "lesson": "第1课·修辞辨认｜比喻", "prompt": "下列句子主要运用了哪一种修辞手法？<br><span class='stem'>夜空中的月亮像一只银白色的小船。</span>", "answer": "比喻", "distractors": ["比拟", "引用", "借代"], "explanation": "把“月亮”和“小船”作比较，两者本来不同，却有形状上的相似点。", "tip": "看有没有把一种事物拿另一种不同事物来相比。", "id": 1}, {"category": "修辞", "lesson": "第1课·修辞辨认｜比喻", "prompt": "下列句子主要运用了哪一种修辞手法？<br><span class='stem'>清晨的露珠像一颗颗透明的珍珠。</span>", "answer": "比喻", "distractors": ["借代", "夸张", "引用"], "explanation": "把“露珠”比作“珍珠”，突出晶莹圆润的特点。", "tip": "看到“像”后，还要确认前后是两个不同事物。", "id": 2}, {"category": "修辞", "lesson": "第1课·修辞辨认｜比喻", "prompt": "下列句子主要运用了哪一种修辞手法？<br><span class='stem'>老师是照亮我们前路的一盏灯。</span>", "answer": "比喻", "distractors": ["夸张", "比拟", "引用"], "explanation": "把“老师”比作“灯”，属于暗喻，用“是”连接本体和喻体。", "tip": "出现“是、成了”等，也可能是暗喻。", "id": 3}, {"category": "修辞", "lesson": "第1课·修辞辨认｜比喻", "prompt": "下列句子主要运用了哪一种修辞手法？<br><span class='stem'>一轮银盘挂在深蓝的夜空中。</span>", "answer": "比喻", "distractors": ["比拟", "夸张", "借代"], "explanation": "“银盘”借来比喻月亮，本体没有直接出现，属于借喻。", "tip": "只出现喻体，也可以构成比喻。", "id": 4}, {"category": "修辞", "lesson": "第1课·修辞辨认｜比喻", "prompt": "下列句子主要运用了哪一种修辞手法？<br><span class='stem'>湖面平静得像一面镜子。</span>", "answer": "比喻", "distractors": ["比拟", "借代", "夸张"], "explanation": "把平静的湖面比作镜子，突出平滑、清亮。", "tip": "比喻重在“相似”，不是“代替”。", "id": 5}, {"category": "修辞", "lesson": "第1课·修辞辨认｜比喻", "prompt": "下列句子主要运用了哪一种修辞手法？<br><span class='stem'>她的笑容像春日的阳光一样温暖。</span>", "answer": "比喻", "distractors": ["夸张", "借代", "比拟"], "explanation": "把“笑容”比作“春日阳光”，突出温暖、亲切。", "tip": "找本体、喻词、喻体。", "id": 6}, {"category": "修辞", "lesson": "第1课·修辞辨认｜比喻", "prompt": "下列句子主要运用了哪一种修辞手法？<br><span class='stem'>雨后的彩虹是一座横跨天空的七彩桥。</span>", "answer": "比喻", "distractors": ["引用", "比拟", "夸张"], "explanation": "把彩虹比作七彩桥，属于暗喻。", "tip": "“A 是 B”若是形象比较，可判断为暗喻。", "id": 7}, {"category": "修辞", "lesson": "第1课·修辞辨认｜比喻", "prompt": "下列句子主要运用了哪一种修辞手法？<br><span class='stem'>远处的群山像一道起伏的绿色屏风。</span>", "answer": "比喻", "distractors": ["引用", "比拟", "借代"], "explanation": "把群山比作绿色屏风，突出连绵起伏的外形。", "tip": "先判断两者是否本质不同，再 一方面：外形、动作、说话、内心或神情。", "id": 200}];
const app = document.getElementById('app');
const milestoneEl = document.getElementById('milestone');

let round = [];
let idx = 0, score = 0, streak = 0, answered = false;
let categoryStat = {};
let reached = new Set();

const letters = ['A','B','C','D'];

function shuffle(arr){
  const a = [...arr];
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

function startRound(){
  round = shuffle(BANK).slice(0,50);
  idx=0; score=0; streak=0; answered=false; categoryStat={}; reached=new Set();
  round.forEach(q=>{ if(!categoryStat[q.category]) categoryStat[q.category]={right:0,total:0}; categoryStat[q.category].total++; });
  renderQuestion();
}

function renderHome(){
  app.innerHTML = `
  <div class="home">
    <h2>考试模式</h2>
    <p>系统会从 200 题题库中随机抽取 50 题。修辞与词性以“辨认类型”为主，其他题目考查记叙文六要素、记叙顺序与人物描写手法。</p>
    <div class="homegrid">
      <div class="card"><b>50</b><span>修辞题</span></div>
      <div class="card"><b>60</b><span>词性题</span></div>
      <div class="card"><b>25</b><span>六要素</span></div>
      <div class="card"><b>25</b><span>记叙顺序</span></div>
      <div class="card"><b>40</b><span>描写手法</span></div>
    </div>
    <div class="note">连续答对 3、5、10、20、30 题会触发不同音效。答错后连续答对计数会重新开始。</div>
    <button class="btn primary" onclick="startRound()">开始随机 50 题</button>
  </div>`;
}

function renderQuestion(){
  answered=false;
  const q = round[idx];
  const options = shuffle([q.answer, ...q.distractors]);
  const progress = ((idx)/50)*100;
  app.innerHTML = `
    <div class="stats">
      <div class="stat"><span>进度</span><b>${idx+1} / 50</b></div>
      <div class="stat"><span>得分</span><b>${score}</b></div>
      <div class="stat"><span>连续答对</span><b>${streak}</b></div>
      <div class="stat"><span>题型</span><b>${q.category}</b></div>
    </div>
    <div class="progress"><i style="width:${progress}%"></i></div>
    <div class="quiz">
      <div class="meta"><span class="tag">${q.category}</span><span class="tag">题库编号 #${q.id}</span></div>
      <div class="question"><span class="qno">第 ${idx+1} 题</span><br>${q.prompt}</div>
      <div class="options">
        ${options.map((op,i)=>`<button class="option" data-op="${escapeAttr(op)}" onclick="choose(this,'${escapeJs(op)}')"><span class="letter">${letters[i]}</span>${op}</button>`).join('')}
      </div>
      <div class="feedback" id="feedback"></div>
      <div class="controls">
        <button class="btn secondary" onclick="renderHome()">退出本轮</button>
        <button class="btn primary" id="nextBtn" disabled onclick="nextQuestion()">${idx===49?'查看成绩':'下一题'}</button>
      </div>
    </div>`;
}

function escapeAttr(s){ return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function escapeJs(s){ return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'"); }

function choose(btn, selected){
  if(answered) return;
  answered=true;
  const q=round[idx];
  const ok = selected===q.answer;
  document.querySelectorAll('.option').forEach(b=>{
    b.disabled=true;
    if(b.dataset.op===q.answer) b.classList.add('correct');
  });
  if(!ok) btn.classList.add('wrong');

  if(ok){
    score++; streak++; categoryStat[q.category].right++;
    playCorrect();
    checkMilestone();
  }else{
    streak=0; reached.clear(); playWrong();
  }

  const fb=document.getElementById('feedback');
  fb.className='feedback show '+(ok?'ok':'no');
  fb.innerHTML=`
    <h3>${ok?'✓ 回答正确':'✗ 回答错误'}${ok?'':`｜正确答案：${q.answer}`}</h3>
    <div class="lesson">课别：${q.lesson}</div>
    <div class="explain"><b>题解：</b>${q.explanation}</div>
    <div class="tip"><b>解题提示：</b>${q.tip}</div>`;
  document.getElementById('nextBtn').disabled=false;

  // refresh stats without rerendering
  const stats=document.querySelectorAll('.stat b');
  if(stats.length>=3){ stats[1].textContent=score; stats[2].textContent=streak; }
}

function nextQuestion(){
  if(!answered) return;
  if(idx===49) return renderResult();
  idx++; renderQuestion();
}

function renderResult(){
  const pct=Math.round(score/50*100);
  let comment = pct>=90?'掌握稳定，注意继续保持判断准确度。':
                pct>=75?'基础较稳，建议复习错题所属课别。':
                pct>=60?'已有基础，但易混类型还需要再练。':
                '建议先复习定义和辨认步骤，再开始下一轮。';
  const rows = Object.entries(categoryStat).map(([k,v])=>{
    const p=v.total?Math.round(v.right/v.total*100):0;
    return `<div class="row"><span>${k}</span><div class="bar"><i style="width:${p}%"></i></div><b>${v.right}/${v.total}</b></div>`;
  }).join('');
  app.innerHTML=`
    <div class="result">
      <h2>本轮完成</h2>
      <div class="bigscore">${score}<span style="font-size:24px;color:#92a3b8"> / 50</span></div>
      <p>${comment}</p>
      <div class="breakdown">${rows}</div>
      <button class="btn primary" onclick="startRound()">再随机 50 题</button>
      <button class="btn secondary" style="margin-left:8px" onclick="renderHome()">返回首页</button>
    </div>`;
}

function ctx(){
  if(!window.__audioCtx) window.__audioCtx = new (window.AudioContext||window.webkitAudioContext)();
  return window.__audioCtx;
}
function tone(freq,dur=0.12,type='sine',gain=0.035,delay=0){
  const c=ctx(), o=c.createOscillator(), g=c.createGain();
  o.type=type; o.frequency.value=freq; g.gain.value=gain;
  o.connect(g); g.connect(c.destination);
  const t=c.currentTime+delay; o.start(t); o.stop(t+dur);
}
function playCorrect(){ tone(660,.08,'sine',.025); tone(880,.09,'sine',.025,.08); }
function playWrong(){ tone(240,.10,'square',.018); tone(180,.14,'square',.014,.08); }
function playMilestone(n){
  const map={
    3:[[700,.08],[900,.08],[1100,.10]],
    5:[[523,.08],[659,.08],[784,.11]],
    10:[[660,.08],[880,.08],[990,.08],[1320,.14]],
    20:[[523,.07],[659,.07],[784,.07],[1046,.07],[1318,.14]],
    30:[[392,.07],[523,.07],[659,.07],[784,.07],[1046,.07],[1318,.18]]
  };
  (map[n]||[]).forEach((x,i)=>tone(x[0],x[1],'triangle',.03,i*.075));
}
function checkMilestone(){
  const milestones=[3,5,10,20,30];
  if(milestones.includes(streak) && !reached.has(streak)){
    reached.add(streak); playMilestone(streak);
    milestoneEl.textContent=`连续答对 ${streak} 题`;
    milestoneEl.classList.add('show');
    setTimeout(()=>milestoneEl.classList.remove('show'),1300);
  }
}

renderHome();
</script>
